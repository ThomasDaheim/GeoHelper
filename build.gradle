// =====================================================================================================================
// GeoHelper build - geo related helpers (map, geo services) for ThomasDaheim Java applications
// =====================================================================================================================
//
//   gradlew build  -> compile, test, jar + publishToMavenLocal (consumers use tf.GeoHelper:GeoHelper:<version>)
//   gradlew publishToMavenLocal -> only publish, without running the tests
//
// The ExifTool wrapper moved to its own library ExifToolHelper (no JavaFX / map dependencies for its users).
// Map (GeoTagger plan 4) and geo services (plan 5) will follow here.
// =====================================================================================================================

plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'tf.GeoHelper'
version = '0.1'
description = 'Geo helpers (map, geo services) for ThomasDaheim Java applications'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 doesn't provide the launcher automatically anymore
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    testLogging.showStandardStreams = true
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

tasks.named('build') {
    finalizedBy 'publishToMavenLocal'
}
